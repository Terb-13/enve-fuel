<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ENVE Fuel</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0a0a0b;--s:#121214;--fg:#f4f4f5;--m:#a1a1aa;--b:#26262c;--r:#c41230}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:DM Sans,system-ui,sans-serif}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.d{font-family:Barlow Condensed,sans-serif;text-transform:uppercase;letter-spacing:-.02em}
.w{max-width:70rem;margin:0 auto;padding:0 1.1rem}
header{position:sticky;top:0;z-index:10;background:rgba(10,10,11,.92);border-bottom:1px solid var(--b)}
.nav{height:3.75rem;display:flex;align-items:center;justify-content:space-between}
.logo{height:1.6rem}.btn{height:2.5rem;padding:0 1rem;border:0;border-radius:.25rem;font-weight:600;font-size:.85rem;cursor:pointer}
.bp{background:var(--fg);color:var(--bg)}.bg{background:0;color:var(--fg);border:1px solid #3f3f46}
.hero{padding:3rem 0;border-bottom:1px solid var(--b);background:linear-gradient(90deg,#0a0a0b 40%,transparent),url(https://raw.githubusercontent.com/Terb-13/enve-fuel/main/public/products/hero-lifestyle.jpg) right/cover}
h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:.95;margin:0}
.lead{color:var(--m);max-width:24rem;line-height:1.5}
.grid{display:grid;gap:1rem;padding:2.5rem 0}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(min-width:1000px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{border:1px solid var(--b);border-radius:.5rem;overflow:hidden;background:var(--s);display:flex;flex-direction:column}
.card img{aspect-ratio:4/3;object-fit:cover;width:100%;background:#000}
.card .bd{padding:.9rem;flex:1;display:flex;flex-direction:column}
.card h3{margin:0;font-size:1.15rem}.card p{color:var(--m);font-size:.82rem;margin:.3rem 0 0}
.row{margin-top:auto;padding-top:.9rem;display:flex;justify-content:space-between;align-items:center}
.price{font-family:ui-monospace,monospace}
footer{border-top:1px solid var(--b);padding:2rem 0;color:var(--m);font-size:.85rem}
.badge{font-size:.6rem;text-transform:uppercase;border:1px solid var(--b);padding:.1rem .35rem;border-radius:.2rem;color:var(--m);margin-right:.25rem}
</style></head><body>
<header><div class="w nav">
<a href="#" style="display:flex;align-items:center;gap:.6rem"><img class="logo" src="https://raw.githubusercontent.com/Terb-13/enve-fuel/main/public/brand/enve-logo-light.jpg" alt="ENVE"/><span class="d" style="font-size:.7rem;color:var(--m);letter-spacing:.15em">Fuel</span></a>
<div style="display:flex;gap:.5rem;align-items:center">
<a class="btn bg" href="https://github.com/Terb-13/enve-fuel" target="_blank" rel="noreferrer">GitHub</a>
<button class="btn bp" type="button" id="cartBtn">Cart (0)</button>
</div></div></header>
<section class="hero"><div class="w">
<p class="d" style="font-size:.7rem;letter-spacing:.2em;color:var(--m)">Performance nutrition</p>
<h1 class="d">Fuel engineered<br><span style="color:var(--m)">like carbon.</span></h1>
<p class="lead">Gels, electrolytes, and chews for riders who race ENVE wheels.</p>
<p style="margin-top:1.2rem"><a class="btn bp" href="#shop">Shop ENVE Fuel</a></p>
</div></section>
<section id="shop" class="w"><div class="grid" id="grid"></div></section>
<footer class="w">
<p>ENVE Fuel concept storefront · <a href="https://enve.com" target="_blank" rel="noreferrer">enve.com</a> · <a href="https://github.com/Terb-13/enve-fuel/releases/tag/enve-fuel-assets">Download images</a></p>
<p style="font-size:.75rem;color:#71717a">Demo checkout · Free shipping over $100</p>
</footer>
<script>
const I="https://raw.githubusercontent.com/Terb-13/enve-fuel/main/public/products/";
const P=[
{n:"ENVE Gel 30",t:"30g carb precision gel",p:350,i:I+"gel-30.jpg",b:["30g carb"]},
{n:"ENVE Rocket Gel",t:"50g carb + 100mg caffeine",p:425,i:I+"gel-50.jpg",b:["50g","Caffeine"]},
{n:"ENVE Fizz",t:"0 sugar B12 electrolytes",p:1299,i:I+"fizz-tubes.jpg",b:["0 sugar","B12"]},
{n:"ENVE Fizz Combo",t:"30 tubes, 3 flavors",p:3499,i:I+"fizz-combo.jpg",b:["30 tubes"]},
{n:"ENVE Energy Chews",t:"Pink lemonade pocket fuel",p:2899,i:I+"chews.jpg",b:["Chews"]}
];
const m=c=>(c/100).toLocaleString("en-US",{style:"currency",currency:"USD"});
let cart=0;
const grid=document.getElementById("grid");
grid.innerHTML=P.map((p,i)=>`<article class="card"><img src="${p.i}" alt="${p.n}" loading="lazy"/><div class="bd"><div>${p.b.map(x=>`<span class="badge">${x}</span>`).join("")}</div><h3 class="d">${p.n}</h3><p>${p.t}</p><div class="row"><span class="price">${m(p.p)}</span><button class="btn bp" type="button" data-i="${i}">+ Add</button></div></div></article>`).join("");
grid.querySelectorAll("button").forEach(b=>b.onclick=()=>{cart++;document.getElementById("cartBtn").textContent="Cart ("+cart+")";});
document.getElementById("cartBtn").onclick=()=>{if(!cart)return;alert("Order placed — thanks for riding with ENVE Fuel.");cart=0;document.getElementById("cartBtn").textContent="Cart (0)";};
</script></body></html>
